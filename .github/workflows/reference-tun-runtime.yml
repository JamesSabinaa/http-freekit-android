name: Android reference selected-UID runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-tun-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reference-tun:
    name: Reference TUN API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '26'
            image: system-images;android-26;default;x86_64
          - api: '37'
            image: system-images;android-37.0;default;x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require separate reference producers and verifier
        run: |
          test -f tools/transport-spike/reference-tun-descriptor.mjs
          test -f tools/transport-spike/reference-tun-results.mjs
          test -f tools/transport-spike/reference-tun-worker-client.mjs
          test -f tools/transport-spike/run-reference-tun-runtime.mjs
          test -f scripts/verify-reference-tun-runtime.py
          test -f tools/transport-spike/android/src/androidTest/kotlin/com/httpfreekit/interop/DraftReferenceTunInteropTest.kt
      - name: Require Linux KVM
        run: |
          if [[ ! -c /dev/kvm ]]; then
            echo '::error::This runner does not expose /dev/kvm.'
            exit 1
          fi
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo '::error::The runner cannot access accelerated Android emulation.'
            exit 1
          fi
      - name: Install Linux emulator runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Node research fixture
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: tools/transport-spike/package-lock.json
      - name: Require pinned Node and OpenSSL 3
        run: |
          node --version
          openssl version
          if [[ "$(node --version)" != v24.22.1 || "$(openssl version)" != 'OpenSSL 3.'* ]]; then
            echo '::error::Enrollment research requires Node 24.22.1 and OpenSSL 3.'
            exit 1
          fi
      - name: Install locked research dependencies
        run: npm --prefix tools/transport-spike ci --ignore-scripts --no-fund
      - name: Prepare private ADB server log
        run: |
          umask 077
          adb_log_dir="$(mktemp -d "$RUNNER_TEMP/enrollment-adb-log.XXXXXX")"
          export ANDROID_ADB_LOG_PATH="$adb_log_dir/server.log"
          : > "$ANDROID_ADB_LOG_PATH"
          printf 'ANDROID_ADB_LOG_PATH=%s\n' "$ANDROID_ADB_LOG_PATH" >> "$GITHUB_ENV"
      - name: Bootstrap verified Android command-line tools
        env:
          ANDROID_TOOLS_ARCHIVE: commandlinetools-linux-15859902_latest.zip
          ANDROID_TOOLS_SHA256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
        run: |
          sdk_root="$RUNNER_TEMP/enrollment-android-sdk"
          archive="$RUNNER_TEMP/enrollment-android-command-line-tools.zip"
          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/$ANDROID_TOOLS_ARCHIVE" --output "$archive"
          printf '%s  %s\n' "$ANDROID_TOOLS_SHA256" "$archive" | sha256sum --check
          mkdir -p "$sdk_root/cmdline-tools"
          unzip -q "$archive" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          {
            printf 'ANDROID_HOME=%s\n' "$sdk_root"
            printf 'ANDROID_SDK_ROOT=%s\n' "$sdk_root"
            printf 'ANDROID_AVD_HOME=%s\n' "$RUNNER_TEMP/enrollment-avd"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_root/cmdline-tools/latest/bin" "$sdk_root/platform-tools" "$sdk_root/emulator" >> "$GITHUB_PATH"
      - name: Accept SDK licences and install emulator packages
        env:
          SYSTEM_IMAGE: ${{ matrix.image }}
        run: |
          answers="$RUNNER_TEMP/enrollment-sdk-license-answers.txt"
          printf 'y\n%.0s' {1..100} > "$answers"
          sdkmanager --sdk_root="$ANDROID_HOME" --licenses < "$answers" > "$RUNNER_TEMP/enrollment-sdk-licenses.log"
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'platform-tools' 'emulator' "$SYSTEM_IMAGE"
          emulator -version
          emulator -accel-check
          adb version
          sdkmanager --sdk_root="$ANDROID_HOME" --list_installed
      - name: Run reference selected-UID suite on a fresh AVD
        env:
          API_LEVEL: ${{ matrix.api }}
          SYSTEM_IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' > "$RUNNER_TEMP/enrollment-avd-answers.txt"
          avdmanager create avd --force --name freekit-enrollment --package "$SYSTEM_IMAGE" --device pixel < "$RUNNER_TEMP/enrollment-avd-answers.txt"
          emulator -avd freekit-enrollment -port 5554 -accel on -gpu swiftshader \
            -no-window -no-audio -no-boot-anim -no-snapshot -camera-front none -camera-back none \
            -cores 2 -memory 3072 > "$RUNNER_TEMP/enrollment-emulator.log" 2>&1 &
          emulator_pid=$!
          driver_status=null
          # BEGIN A22 OWNED EMULATOR CLEANUP
          cleanup() {
            local status="$1" cleanup_status=0 stop_status=0 wait_status=null attempt
            local terminated=false joined=false
            trap - EXIT
            if timeout --kill-after=1s 10s adb -s emulator-5554 emu kill >/dev/null 2>&1; then
              stop_status=0
            else
              stop_status=$?
            fi
            if kill -0 "$emulator_pid" 2>/dev/null; then
              kill "$emulator_pid" 2>/dev/null || true
              for ((attempt=0; attempt<50; attempt++)); do
                if ! kill -0 "$emulator_pid" 2>/dev/null; then break; fi
                sleep 0.1
              done
            fi
            if kill -0 "$emulator_pid" 2>/dev/null; then
              kill -KILL "$emulator_pid" 2>/dev/null || true
              for ((attempt=0; attempt<50; attempt++)); do
                if ! kill -0 "$emulator_pid" 2>/dev/null; then break; fi
                sleep 0.1
              done
            fi
            if kill -0 "$emulator_pid" 2>/dev/null; then
              cleanup_status=1
            else
              terminated=true
              if wait "$emulator_pid" 2>/dev/null; then wait_status=0; else wait_status=$?; fi
              if (( wait_status != 127 )); then joined=true; else cleanup_status=1; fi
            fi
            export A22_DRIVER_STATUS="$driver_status" A22_STOP_STATUS="$stop_status"
            export A22_TERMINATED="$terminated" A22_JOINED="$joined" A22_EMULATOR_STATUS="$wait_status"
            if ! node --input-type=module <<'JS'
          import fs from 'node:fs';
          const root = 'reference-tun';
          const number = value => value === 'null' ? null : Number(value);
          const record = {
            format: 'http-freekit-reference-tun-host-cleanup', revision: 1,
            sourceCommit: process.env.GITHUB_SHA, api: Number(process.env.API_LEVEL),
            driverExitCode: number(process.env.A22_DRIVER_STATUS), emulatorStarted: true, stopAttempted: true,
            stopExitCode: number(process.env.A22_STOP_STATUS), terminationObserved: process.env.A22_TERMINATED === 'true',
            joinObserved: process.env.A22_JOINED === 'true', emulatorExitCode: number(process.env.A22_EMULATOR_STATUS),
          };
          fs.mkdirSync(`build/reports/${root}`, { recursive: true });
          fs.writeFileSync(`build/reports/${root}/host-cleanup.json`, JSON.stringify(record) + '\n', { mode: 0o600 });
          JS
            then cleanup_status=1; fi
            printf 'Owned emulator cleanup: stop=%s terminated=%s joined=%s exit=%s\n' "$stop_status" "$terminated" "$joined" "$wait_status"
            if (( status == 0 && cleanup_status != 0 )); then status=1; fi
            return "$status"
          }
          # END A22 OWNED EMULATOR CLEANUP
          trap 'status=$?; if cleanup "$status"; then exit 0; else exit $?; fi' EXIT
          deadline=$((SECONDS + 600))
          while true; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo '::error::The enrollment emulator exited before boot completed.'
              exit 1
            fi
            if booted="$(timeout --kill-after=1s 5s adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null)"; then
              if [[ "${booted//$'\r'/}" == 1 ]]; then break; fi
            fi
            if (( SECONDS >= deadline )); then
              echo '::error::Android did not finish booting within 600 seconds.'
              exit 1
            fi
            sleep 5
          done
          actual_api="$(timeout --kill-after=1s 5s adb -s emulator-5554 shell getprop ro.build.version.sdk | tr -d '\r')"
          if [[ "$actual_api" != "$API_LEVEL" ]]; then
            echo '::error::The enrollment emulator API does not match the matrix.'
            exit 1
          fi
          export ANDROID_SERIAL=emulator-5554
          printf 'Booted enrollment emulator API=%s\n' "$actual_api"
          # BEGIN A22 FRESH AVD CLOCK ALIGNMENT
          align_enrollment_clock() {
            local clock_uid automatic_time host_time root_status=0 root_deadline unroot_status=0 shell_deadline remaining
            # adbd can close its transport while root is taking effect. Verify the resulting identity.
            timeout --kill-after=1s 10s adb -s emulator-5554 root >/dev/null || root_status=$?
            printf 'Enrollment ADB root transition exit: %s\n' "$root_status"
            root_deadline=$((SECONDS + 30))
            timeout --kill-after=1s 30s adb -s emulator-5554 wait-for-device >/dev/null || return "$?"
            while true; do
              remaining=$((root_deadline - SECONDS))
              if (( remaining <= 0 )); then return 1; fi
              if (( remaining > 10 )); then remaining=10; fi
              clock_uid="$(timeout --kill-after=1s "${remaining}s" adb -s emulator-5554 shell id -u)" || return "$?"
              clock_uid="${clock_uid//$'\r'/}"
              if (( SECONDS >= root_deadline )); then return 1; fi
              if [[ "$clock_uid" == 0 ]]; then break; fi
              if [[ "$clock_uid" != 2000 ]]; then return 1; fi
              sleep 1
            done
            timeout --kill-after=1s 10s adb -s emulator-5554 shell settings put global auto_time 0 >/dev/null || return "$?"
            automatic_time="$(timeout --kill-after=1s 10s adb -s emulator-5554 shell settings get global auto_time)" || return "$?"
            if [[ "${automatic_time//$'\r'/}" != 0 ]]; then return 1; fi
            host_time="$(date +%s.%N)" || return "$?"
            if [[ ! "$host_time" =~ ^[0-9]{10}\.[0-9]{9}$ ]]; then return 1; fi
            timeout --kill-after=1s 10s adb -s emulator-5554 shell /system/bin/toybox date -u "@$host_time" >/dev/null || return "$?"
            # adbd can close its transport while unroot is taking effect. Verify the resulting identity.
            timeout --kill-after=1s 10s adb -s emulator-5554 unroot >/dev/null || unroot_status=$?
            printf 'Enrollment ADB unroot transition exit: %s\n' "$unroot_status"
            shell_deadline=$((SECONDS + 30))
            timeout --kill-after=1s 30s adb -s emulator-5554 wait-for-device >/dev/null || return "$?"
            while true; do
              remaining=$((shell_deadline - SECONDS))
              if (( remaining <= 0 )); then return 1; fi
              if (( remaining > 10 )); then remaining=10; fi
              clock_uid="$(timeout --kill-after=1s "${remaining}s" adb -s emulator-5554 shell id -u)" || return "$?"
              clock_uid="${clock_uid//$'\r'/}"
              if (( SECONDS >= shell_deadline )); then return 1; fi
              if [[ "$clock_uid" == 2000 ]]; then break; fi
              if [[ "$clock_uid" != 0 ]]; then return 1; fi
              sleep 1
            done
            echo 'Fresh AVD clock alignment completed; ordinary ADB shell restored.'
          }
          # END A22 FRESH AVD CLOCK ALIGNMENT
          align_enrollment_clock
          started="$(date +%s)"
          # The distinct driver owns exact package/signature/permission admission.
          if node tools/transport-spike/run-reference-tun-runtime.mjs --serial emulator-5554; then driver_status=0; else driver_status=$?; fi
          if cleanup "$driver_status"; then
            python3 -I scripts/verify-reference-tun-runtime.py --source "$GITHUB_SHA" --api "$API_LEVEL" --started "$started"
          else
            exit $?
          fi
      # Fixed sanitized files only: no keys, inputs, APKs, registry, raw logs or AVD data.
      - name: Retain sanitized reference TUN reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-tun-api-${{ matrix.api }}-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            tools/transport-spike/android/build/outputs/androidTest-results/reference-tun/debug/runtime.json
            tools/transport-spike/android/build/outputs/androidTest-results/reference-tun/debug/TEST-reference-tun-research.xml
            tools/transport-spike/android/build/reports/androidTests/reference-tun/debug/index.html
            build/reports/reference-tun/host-cleanup.json

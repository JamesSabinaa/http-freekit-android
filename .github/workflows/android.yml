name: Android host validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Check documentation links and checker regressions
        run: |
          node --test scripts/tests/check-doc-links.test.mjs
          node scripts/check-doc-links.mjs
      - name: Test exact Keystore report verification
        run: python3 -m unittest discover -s scripts/tests -p 'test_keystore_results.py'
      - name: Test bounded preview emulator cleanup and exact preflight report gate
        run: node --test scripts/tests/preview-emulator-cleanup.test.mjs scripts/tests/preview-preflight-workflow.test.mjs
      - name: Test bounded Keystore emulator cleanup
        run: |
          test -f scripts/tests/keystore-emulator-cleanup.test.mjs
          node --test scripts/tests/keystore-emulator-cleanup.test.mjs
      - name: Validate draft protocol corpus and guard regressions
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_protocol_corpus.py'
          python3 -m unittest discover -s scripts/tests -p 'test_protocol_conformance.py'
          python3 scripts/check-protocol-corpus.py --corpus protocol/fixtures/a19-draft-0.3
      - name: Validate independent enrollment corpus and evidence guards
        run: |
          node --test scripts/tests/enrollment-*.test.mjs scripts/tests/enrolled-tun-runtime.test.mjs
          node scripts/check-enrollment-corpus.mjs
      - name: Test debug delivery bundle integrity
        run: |
          test -f scripts/verify-debug-delivery.py
          test -f scripts/tests/test_debug_delivery.py
          python3 -I -m unittest discover -s scripts/tests -p 'test_debug_delivery.py'
      - name: Test independent capture runtime evidence verification
        run: python3 -m unittest discover -s scripts/tests -p 'test_capture_runtime.py'
      - name: Test independent cold TCP evidence verification
        run: python3 -m unittest discover -s scripts/tests -p 'test_capture_cold_runtime.py'
      - name: Test independent reference TUN evidence verification
        run: python3 -I -m unittest discover -s scripts/tests -p 'test_reference_tun_runtime.py'
      - name: Check committed whitespace
        run: git diff --check --no-renames "$(git hash-object -t tree --stdin </dev/null)" HEAD
      - name: Validate workflow syntax
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint"

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Node test peer
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: tools/transport-spike/package-lock.json
      - name: Bootstrap verified Android command-line tools
        env:
          ANDROID_TOOLS_ARCHIVE: commandlinetools-linux-15859902_latest.zip
          ANDROID_TOOLS_SHA256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
        run: |
          sdk_root="$RUNNER_TEMP/android-sdk"
          archive="$RUNNER_TEMP/android-command-line-tools.zip"
          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/$ANDROID_TOOLS_ARCHIVE" --output "$archive"
          printf '%s  %s\n' "$ANDROID_TOOLS_SHA256" "$archive" | sha256sum --check
          mkdir -p "$sdk_root/cmdline-tools"
          unzip -q "$archive" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          {
            printf 'ANDROID_HOME=%s\n' "$sdk_root"
            printf 'ANDROID_SDK_ROOT=%s\n' "$sdk_root"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_root/cmdline-tools/latest/bin" "$sdk_root/platform-tools" >> "$GITHUB_PATH"
      - name: Accept Android SDK licences and install pinned packages
        run: |
          answers="$RUNNER_TEMP/android-sdk-license-answers.txt"
          printf 'y\n%.0s' {1..100} > "$answers"
          sdkmanager --sdk_root="$ANDROID_HOME" --licenses < "$answers" > "$RUNNER_TEMP/android-sdk-licenses.log"
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Install locked transport test dependencies
        run: npm --prefix tools/transport-spike ci --ignore-scripts --no-fund
      - name: Check the research fixture's OpenSSL prerequisite
        run: |
          openssl version
          if [[ "$(openssl version)" != 'OpenSSL 3.'* ]]; then
            echo '::error::The Android-to-Node research fixture requires OpenSSL 3.'
            exit 1
          fi
      - name: Test the loopback enrollment and WebSocket fixture
        run: node --test tools/transport-spike/android-peer.test.mjs
      - name: Test strict instrumentation result parsing
        run: node --test tools/transport-spike/instrumentation-results.test.mjs
      - name: Test strict draft-stream instrumentation result parsing
        run: node --test tools/transport-spike/draft-stream-results.test.mjs
      - name: Test owned draft-stream processes and driver CLI
        run: node --test tools/transport-spike/draft-stream-command.test.mjs tools/transport-spike/run-draft-streaming.test.mjs
      - name: Test private enrollment commands, input, worker and phase parsing
        run: node --test tools/transport-spike/enrollment-runtime-*.test.mjs
      - name: Test bounded research WebSocket framing
        run: node --test tools/transport-spike/research-websocket*.test.mjs
      - name: Test maintained transport peers, HTTP origin wire and runtime gates
        run: node --test tools/transport-spike/gateway-websocket-peer.test.mjs tools/transport-spike/companion-http-origin.test.mjs tools/transport-spike/capture-factory-results.test.mjs
      - name: Test the private authenticated interception CA TLS peer
        run: node --test tools/transport-spike/companion-interception-ca-peer.test.mjs
      - name: Test fixed reference HTTP and HTTPS interception composition
        run: >-
          node --test tools/transport-spike/reference-interception-contract.test.mjs
          tools/transport-spike/reference-interception-assets.test.mjs
          tools/transport-spike/reference-interception-backend.test.mjs
          tools/transport-spike/reference-interception-enrollment.test.mjs
          tools/transport-spike/reference-interception-peer.test.mjs
      - name: Test separate Android reference TUN fixture and runtime owners
        run: >-
          node --test tools/transport-spike/reference-tun-fixture.test.mjs
          tools/transport-spike/reference-tun-worker.test.mjs
          tools/transport-spike/reference-tun-worker-client.test.mjs
          tools/transport-spike/reference-tun-descriptor.test.mjs
          tools/transport-spike/reference-tun-results.test.mjs
          tools/transport-spike/reference-tun-driver.test.mjs
          tools/transport-spike/reference-tun-workflow.test.mjs
      - name: Test the authenticated draft-stream peer and owned cleanup
        run: node --test tools/transport-spike/companion-stream-peer*.test.mjs
      - name: Test finite capture receivers, execution gates and owned cleanup
        run: node --test tools/capture-spike/*.test.mjs
      - name: Collect bounded host TLS pressure diagnostics
        run: timeout --kill-after=10s 180s node tools/transport-spike/companion-stream-peer-pressure.mjs
      - name: Test independent draft protocol codec and lifecycle
        run: |
          node --test tools/transport-spike/companion-protocol-codec.test.mjs \
            tools/transport-spike/companion-protocol-lifecycle.test.mjs \
            tools/transport-spike/companion-protocol-conformance.test.mjs
          node tools/transport-spike/companion-protocol-conformance.mjs
      - name: Test enrollment codecs, authority, crypto and real process recovery
        env:
          FREEKIT_ENROLLMENT_CRASH_REPORT: build/reports/enrollment-store/crash.json
        run: |
          started="$(date +%s)"
          node --test tools/transport-spike/companion-enrollment-*.test.mjs
          node scripts/verify-enrollment-crash-report.mjs \
            --source "$GITHUB_SHA" --platform linux --started "$started"
      - name: Compile, test, and lint
        run: >-
          ./gradlew --no-daemon --console=plain
          :core-protocol:test
          :transport-framing:test
          :gateway-websocket:test
          :core-security:testDebugUnitTest :core-security:assembleDebugAndroidTest :core-security:lintDebug
          :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
          :transport-interop:testDebugUnitTest :transport-interop:assembleDebugAndroidTest :transport-interop:lintDebug
          :core-capture:testDebugUnitTest :core-capture:lintDebug
          :capture-transport-research:testDebugUnitTest :capture-transport-research:testReferenceIntegration :capture-transport-research:assembleDebug :capture-transport-research:lintDebug
          :capture-runtime:testDebugUnitTest :capture-runtime:assembleDebug :capture-runtime:assembleDebugAndroidTest :capture-runtime:lintDebug
          :capture-traffic:testDebugUnitTest :capture-traffic:assembleDebug :capture-traffic:lintDebug
          :installed-app-fixture:assembleDebug :installed-app-fixture:assembleRelease
          :installed-app-fixture:lintDebug :installed-app-fixture:lintRelease
      - name: Compare complete independent protocol outcomes
        run: >-
          python3 scripts/compare-protocol-conformance.py
          --corpus protocol/fixtures/a19-draft-0.3
          --kotlin build/reports/draft-protocol/kotlin-conformance.json
          --node build/reports/draft-protocol/node-conformance.json
      - name: Compare complete independent enrollment outcomes
        run: node scripts/compare-enrollment-conformance.mjs
      - name: Record resolved dependency inventories
        run: |
          mkdir -p build/reports/dependencies
          ./gradlew --no-daemon --console=plain :app:dependencies --configuration debugRuntimeClasspath \
            > build/reports/dependencies/android-debug-runtime.txt
          ./gradlew --no-daemon --console=plain :app:dependencies --configuration releaseRuntimeClasspath \
            > build/reports/dependencies/android-release-runtime.txt
          ./gradlew --no-daemon --console=plain :core-protocol:dependencies --configuration testRuntimeClasspath \
            > build/reports/dependencies/core-test-runtime.txt
          ./gradlew --no-daemon --console=plain :core-security:dependencies --configuration debugUnitTestRuntimeClasspath \
            > build/reports/dependencies/security-test-runtime.txt
          ./gradlew --no-daemon --console=plain :gateway-websocket:dependencies --configuration testRuntimeClasspath \
            > build/reports/dependencies/gateway-test-runtime.txt
          npm --prefix tools/transport-spike ls --all --json > build/reports/dependencies/node-test-runtime.json
      # Publish reports only. APKs, local debug keys, temporary TLS keys, and dist/ are excluded.
      - name: Retain host validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-host-validation-reports
          retention-days: 7
          if-no-files-found: warn
          path: |
            app/build/reports/tests/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            core-protocol/build/reports/tests/
            core-protocol/build/test-results/test/
            core-security/build/reports/tests/
            core-security/build/reports/lint-results-debug.*
            core-security/build/test-results/testDebugUnitTest/
            tools/transport-spike/android/build/reports/lint-results-debug.*
            tools/transport-spike/android/build/reports/tests/
            tools/transport-spike/android/build/test-results/testDebugUnitTest/
            tools/transport-spike/framing/build/reports/tests/
            tools/transport-spike/framing/build/test-results/test/
            tools/transport-spike/gateway-websocket/build/reports/tests/
            tools/transport-spike/gateway-websocket/build/test-results/test/
            tools/installed-app-fixture/build/reports/lint-results-*
            core-capture/build/reports/tests/
            core-capture/build/test-results/testDebugUnitTest/
            core-capture/build/reports/lint-results-debug.*
            tools/capture-spike/transport/build/reports/tests/
            tools/capture-spike/transport/build/test-results/testDebugUnitTest/
            tools/capture-spike/transport/build/test-results/testReferenceIntegration/
            tools/capture-spike/transport/build/reports/lint-results-debug.*
            tools/capture-spike/runtime/build/reports/lint-results-debug.*
            tools/capture-spike/runtime/build/reports/tests/
            tools/capture-spike/runtime/build/test-results/testDebugUnitTest/
            tools/capture-spike/traffic/build/reports/lint-results-debug.*
            tools/capture-spike/traffic/build/reports/tests/
            tools/capture-spike/traffic/build/test-results/testDebugUnitTest/
            build/reports/draft-protocol/*-conformance.json
            build/reports/draft-enrollment/*-conformance.json
            build/reports/enrollment-store/crash.json
            build/reports/draft-stream-pressure/pressure.json
            build/reports/interception-ca/jvm-tls.json
            build/reports/dependencies/

  native-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check raw-packet and proxy fixture regressions
        run: python3 -m unittest discover -s tools/engine-spike -p 'test_*.py'
      - name: Fetch the pinned engine and its submodules
        env:
          ENGINE_COMMIT: c0dfc4b07baa5e48022f5f88ac90488601f05674
        run: |
          engine_root=.gradle/engine-spike/hev-socks5-tunnel
          git init "$engine_root"
          git -C "$engine_root" remote add origin https://github.com/heiher/hev-socks5-tunnel.git
          git -C "$engine_root" fetch --depth 1 origin "$ENGINE_COMMIT"
          git -C "$engine_root" checkout --detach FETCH_HEAD
          git -C "$engine_root" submodule update --init --recursive --depth 1
      - name: Prove packet-to-stream forwarding without privileged networking
        run: python3 tools/engine-spike/run_linux.py --engine-root .gradle/engine-spike/hev-socks5-tunnel

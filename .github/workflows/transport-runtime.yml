name: Android-to-Node transport runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transport-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transport:
    name: Transport API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '26'
            image: system-images;android-26;default;x86_64
          - api: '37'
            image: system-images;android-37.0;default;x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require Linux KVM
        run: |
          if [[ ! -c /dev/kvm ]]; then
            echo '::error::This runner does not expose /dev/kvm; accelerated Android runtime validation cannot run.'
            exit 1
          fi
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo '::error::The runner cannot access /dev/kvm; no software-emulation fallback is permitted.'
            exit 1
          fi
      - name: Install Linux emulator runtime dependency
        run: |
          # QEMU links libpulse even when the emulator starts with -no-audio.
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Node test peer
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: tools/transport-spike/package-lock.json
      - name: Check Node and OpenSSL prerequisites
        run: |
          node --version
          openssl version
          if [[ "$(node --version)" != v24.22.1 ]]; then
            echo '::error::The transport fixture requires the pinned Node 24.22.1 runtime.'
            exit 1
          fi
          if [[ "$(openssl version)" != 'OpenSSL 3.'* ]]; then
            echo '::error::The transport fixture requires OpenSSL 3.'
            exit 1
          fi
      - name: Install locked transport fixture dependencies
        run: npm --prefix tools/transport-spike ci --ignore-scripts --no-fund
      - name: Bootstrap verified Android command-line tools
        env:
          ANDROID_TOOLS_ARCHIVE: commandlinetools-linux-15859902_latest.zip
          ANDROID_TOOLS_SHA256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
        run: |
          sdk_root="$RUNNER_TEMP/transport-android-sdk"
          archive="$RUNNER_TEMP/transport-android-command-line-tools.zip"
          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/$ANDROID_TOOLS_ARCHIVE" --output "$archive"
          printf '%s  %s\n' "$ANDROID_TOOLS_SHA256" "$archive" | sha256sum --check
          mkdir -p "$sdk_root/cmdline-tools"
          unzip -q "$archive" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          {
            printf 'ANDROID_HOME=%s\n' "$sdk_root"
            printf 'ANDROID_SDK_ROOT=%s\n' "$sdk_root"
            printf 'ANDROID_AVD_HOME=%s\n' "$RUNNER_TEMP/transport-avd"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_root/cmdline-tools/latest/bin" "$sdk_root/platform-tools" "$sdk_root/emulator" >> "$GITHUB_PATH"
      - name: Accept SDK licences and install emulator packages
        env:
          SYSTEM_IMAGE: ${{ matrix.image }}
        run: |
          answers="$RUNNER_TEMP/transport-sdk-license-answers.txt"
          printf 'y\n%.0s' {1..100} > "$answers"
          sdkmanager --sdk_root="$ANDROID_HOME" --licenses < "$answers" > "$RUNNER_TEMP/transport-sdk-licenses.log"
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools' 'emulator' "$SYSTEM_IMAGE"
          emulator -version
          emulator -accel-check
          adb version
          sdkmanager --sdk_root="$ANDROID_HOME" --list_installed
      - name: Run Android-to-Node instrumentation on a fresh AVD
        env:
          API_LEVEL: ${{ matrix.api }}
          SYSTEM_IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' > "$RUNNER_TEMP/transport-avd-answers.txt"
          avdmanager create avd --force --name freekit-transport --package "$SYSTEM_IMAGE" --device pixel < "$RUNNER_TEMP/transport-avd-answers.txt"
          emulator_log="$RUNNER_TEMP/transport-emulator.log"
          emulator -avd freekit-transport -port 5554 -accel on -gpu swiftshader \
            -no-window -no-audio -no-boot-anim -no-snapshot -camera-front none -camera-back none \
            -cores 2 -memory 3072 > "$emulator_log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            status=$?
            trap - EXIT
            adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
            kill "$emulator_pid" >/dev/null 2>&1 || true
            wait "$emulator_pid" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          report_host_diagnostic() {
            local driver_status="$1" emulator_state=pid_present emulator_exit=null
            local probe="$RUNNER_TEMP/transport-adb-state.txt" adb_status
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              emulator_state=terminated
              if wait "$emulator_pid" 2>/dev/null; then emulator_exit=0; else emulator_exit=$?; fi
            fi
            # Discard stderr; UI's driver owns its classification. Capture at most 256 stdout bytes.
            if timeout --kill-after=1s 5s adb -s emulator-5554 get-state 2>/dev/null | head -c 256 > "$probe"; then
              adb_status=${PIPESTATUS[0]}
            else
              adb_status=${PIPESTATUS[0]}
            fi
            python3 - "$driver_status" "$emulator_pid" "$emulator_state" "$emulator_exit" "$adb_status" "$probe" "$emulator_log" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys

          driver, pid, state, emulator_exit, adb_exit, probe, emulator_log = sys.argv[1:]
          adb_exit = int(adb_exit)
          response = Path(probe).read_bytes()[:256].decode("ascii", errors="replace").strip()
          adb_category = "timeout" if adb_exit in (124, 137) else "command_failed" if adb_exit else response if response in ("device", "offline", "unknown") else "unrecognized_response"
          fatal_category = "none_observed"
          try:
              with Path(emulator_log).open("rb") as stream:
                  stream.seek(0, 2)
                  stream.seek(max(0, stream.tell() - 65536))
                  tail = stream.read(65536).decode("utf-8", errors="replace")
              patterns = (
                  ("emulator_panic", r"(?im)^\s*(?:emulator\s*:\s*)?PANIC:"),
                  ("shared_library_load_failure", r"error while loading shared libraries"),
                  ("kvm_initialization_failure", r"(?i)failed to initialize kvm"),
                  ("host_signal_termination", r"qemu-system[-\w]*:\s*terminating on signal \d+"),
                  ("host_segmentation_fault", r"(?im)^.*(?:qemu-system[-\w]*|emulator)[^\n]*[Ss]egmentation fault"),
              )
              fatal_category = next((category for category, pattern in patterns if re.search(pattern, tail)), "none_observed")
          except OSError:
              fatal_category = "log_unavailable"
          report = {
              "api": os.environ["API_LEVEL"], "phase": "after_driver_before_emulator_cleanup",
              "driverExitCode": int(driver),
              "emulator": {"pid": int(pid), "liveness": state, "exitCode": None if emulator_exit == "null" else int(emulator_exit)},
              "adbGetState": {"category": adb_category, "exitCode": adb_exit},
              "qemuFatalCategory": fatal_category,
          }
          target = Path("build/reports/transport-host-diagnostic.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(report, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(report, sort_keys=True))
          PY
          }
          deadline=$((SECONDS + 600))
          while true; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              tail -n 100 "$emulator_log"
              echo '::error::The emulator exited before Android completed booting.'
              exit 1
            fi
            if booted="$(timeout 5s adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null)"; then
              if [[ "${booted//$'\r'/}" == 1 ]]; then break; fi
            fi
            if (( SECONDS >= deadline )); then
              tail -n 100 "$emulator_log"
              echo '::error::Android did not finish booting within 600 seconds.'
              exit 1
            fi
            sleep 5
          done
          actual_api="$(adb -s emulator-5554 shell getprop ro.build.version.sdk | tr -d '\r')"
          if [[ "$actual_api" != "$API_LEVEL" ]]; then
            echo "::error::Expected API $API_LEVEL but the booted emulator reports $actual_api."
            exit 1
          fi
          export ANDROID_SERIAL=emulator-5554
          printf 'Booted emulator API=%s Android=%s\n' "$actual_api" "$(adb -s emulator-5554 shell getprop ro.build.version.release | tr -d '\r')"
          if node tools/transport-spike/run-android-interop.mjs --serial emulator-5554; then
            driver_status=0
          else
            driver_status=$?
            if ! report_host_diagnostic "$driver_status" 2>/dev/null; then
              echo '::warning::Bounded host diagnostic collection failed.'
            fi
            exit "$driver_status"
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path("tools/transport-spike/android/build/outputs/androidTest-results/connected").rglob("TEST-*.xml"))
          if not reports:
              raise SystemExit("No instrumentation XML reports were produced")
          expected = {
              "nonexportableIdentityEnrollsAndEchoes64KiB",
              "wrongPinIsRejected",
              "wrongHostnameIsRejected",
              "missingClientCertificateIsRejected",
          }
          cases = []
          totals = {field: 0 for field in ("tests", "failures", "errors", "skipped")}
          for report in reports:
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
              for suite in suites:
                  for field in totals:
                      totals[field] += int(suite.get(field, "0") or "0")
                  cases.extend(suite.findall("testcase"))
          if totals["tests"] != len(expected) or any(totals[field] for field in ("failures", "errors", "skipped")):
              raise SystemExit(f"Transport instrumentation did not execute a fully passing suite: {totals}")
          if len(cases) != len(expected) or {case.get("name") for case in cases} != expected:
              raise SystemExit("The expected four named transport tests did not execute exactly once")
          if any(case.get("classname") != "com.httpfreekit.interop.AndroidNodeInteropTest" for case in cases):
              raise SystemExit("Unexpected transport test class")
          if any(case.find(result) is not None for case in cases for result in ("failure", "error", "skipped")):
              raise SystemExit("A transport testcase failed or was skipped")
          print(json.dumps({"api": os.environ["API_LEVEL"], **totals}, sort_keys=True))
          PY
      # Retain sanitized reports only: no APKs, peer keys/logs, keystores, AVDs, or userdata.
      - name: Retain instrumentation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transport-api-${{ matrix.api }}-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            tools/transport-spike/android/build/outputs/androidTest-results/connected/**/*.xml
            tools/transport-spike/android/build/reports/androidTests/connected/
            build/reports/transport-host-diagnostic.json

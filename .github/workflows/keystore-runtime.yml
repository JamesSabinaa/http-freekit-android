name: Android Keystore runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keystore-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  keystore:
    name: Keystore API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '26'
            image: system-images;android-26;default;x86_64
          - api: '37'
            image: system-images;android-37.0;default;x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require Linux KVM
        run: |
          if [[ ! -c /dev/kvm ]]; then
            echo '::error::This runner does not expose /dev/kvm; accelerated Android runtime validation cannot run.'
            exit 1
          fi
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo '::error::The runner cannot access /dev/kvm; no software-emulation fallback is permitted.'
            exit 1
          fi
      - name: Install Linux emulator runtime dependency
        run: |
          # QEMU links libpulse even when the emulator starts with -no-audio.
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Bootstrap verified Android command-line tools
        env:
          ANDROID_TOOLS_ARCHIVE: commandlinetools-linux-15859902_latest.zip
          ANDROID_TOOLS_SHA256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
        run: |
          sdk_root="$RUNNER_TEMP/keystore-android-sdk"
          archive="$RUNNER_TEMP/keystore-android-command-line-tools.zip"
          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/$ANDROID_TOOLS_ARCHIVE" --output "$archive"
          printf '%s  %s\n' "$ANDROID_TOOLS_SHA256" "$archive" | sha256sum --check
          mkdir -p "$sdk_root/cmdline-tools"
          unzip -q "$archive" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          {
            printf 'ANDROID_HOME=%s\n' "$sdk_root"
            printf 'ANDROID_SDK_ROOT=%s\n' "$sdk_root"
            printf 'ANDROID_AVD_HOME=%s\n' "$RUNNER_TEMP/keystore-avd"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_root/cmdline-tools/latest/bin" "$sdk_root/platform-tools" "$sdk_root/emulator" >> "$GITHUB_PATH"
      - name: Accept SDK licences and install emulator packages
        env:
          SYSTEM_IMAGE: ${{ matrix.image }}
        run: |
          answers="$RUNNER_TEMP/keystore-sdk-license-answers.txt"
          printf 'y\n%.0s' {1..100} > "$answers"
          sdkmanager --sdk_root="$ANDROID_HOME" --licenses < "$answers" > "$RUNNER_TEMP/keystore-sdk-licenses.log"
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools' 'emulator' "$SYSTEM_IMAGE"
          emulator -version
          emulator -accel-check
          adb version
          sdkmanager --sdk_root="$ANDROID_HOME" --list_installed
      - name: Run Keystore instrumentation on a fresh AVD
        env:
          API_LEVEL: ${{ matrix.api }}
          SYSTEM_IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' > "$RUNNER_TEMP/keystore-avd-answers.txt"
          avdmanager create avd --force --name freekit-keystore --package "$SYSTEM_IMAGE" --device pixel < "$RUNNER_TEMP/keystore-avd-answers.txt"
          emulator_log="$RUNNER_TEMP/keystore-emulator.log"
          emulator -avd freekit-keystore -port 5554 -accel on -gpu swiftshader \
            -no-window -no-audio -no-boot-anim -no-snapshot -camera-front none -camera-back none \
            -cores 2 -memory 3072 > "$emulator_log" 2>&1 &
          emulator_pid=$!
          # BEGIN B7 OWNED EMULATOR CLEANUP
          cleanup() {
            local status="$1" cleanup_status=0 stop_status=null wait_status=null attempt
            local terminated=false joined=false term_attempted=false kill_attempted=false
            trap - EXIT
            if timeout --kill-after=1s 10s adb -s emulator-5554 emu kill >/dev/null 2>&1; then stop_status=0; else stop_status=$?; fi
            if kill -0 "$emulator_pid" 2>/dev/null; then
              term_attempted=true
              kill -TERM "$emulator_pid" 2>/dev/null || true
              for ((attempt=0; attempt<50; attempt++)); do
                if ! kill -0 "$emulator_pid" 2>/dev/null; then break; fi
                if ! timeout --kill-after=1s 1s sleep 0.1; then cleanup_status=1; break; fi
              done
            fi
            if kill -0 "$emulator_pid" 2>/dev/null; then
              kill_attempted=true
              kill -KILL "$emulator_pid" 2>/dev/null || true
              for ((attempt=0; attempt<50; attempt++)); do
                if ! kill -0 "$emulator_pid" 2>/dev/null; then break; fi
                if ! timeout --kill-after=1s 1s sleep 0.1; then cleanup_status=1; break; fi
              done
            fi
            if kill -0 "$emulator_pid" 2>/dev/null; then
              cleanup_status=1
            else
              terminated=true
              if wait "$emulator_pid" 2>/dev/null; then wait_status=0; else wait_status=$?; fi
              if (( wait_status != 127 )); then joined=true; else cleanup_status=1; fi
            fi
            export KEYSTORE_RUNTIME_STATUS="$status"
            export KEYSTORE_STOP_STATUS="$stop_status"
            export KEYSTORE_TERM_ATTEMPTED="$term_attempted" KEYSTORE_KILL_ATTEMPTED="$kill_attempted"
            export KEYSTORE_TERMINATED="$terminated" KEYSTORE_JOINED="$joined" KEYSTORE_EMULATOR_STATUS="$wait_status" KEYSTORE_CLEANUP_STATUS="$cleanup_status"
            if ! timeout --kill-after=1s 5s python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          def number(name, nullable=False):
              value = os.environ[name]
              if nullable and value == "null":
                  return None
              if not re.fullmatch(r"[0-9]{1,3}", value) or int(value) > 255:
                  raise ValueError()
              return int(value)

          def boolean(name):
              value = os.environ[name]
              if value not in ("true", "false"):
                  raise ValueError()
              return value == "true"

          try:
              source = os.environ["GITHUB_SHA"]
              api = int(os.environ["API_LEVEL"])
              if not re.fullmatch(r"[a-f0-9]{40}", source) or api not in (26, 37):
                  raise ValueError()
              record = {
                  "format": "http-freekit-keystore-host-cleanup", "revision": 1,
                  "sourceCommit": source, "api": api, "runtimeExitCode": number("KEYSTORE_RUNTIME_STATUS"),
                  "emulatorStarted": True, "stopAttempted": True, "stopExitCode": number("KEYSTORE_STOP_STATUS"),
                  "termAttempted": boolean("KEYSTORE_TERM_ATTEMPTED"), "killAttempted": boolean("KEYSTORE_KILL_ATTEMPTED"),
                  "terminationObserved": boolean("KEYSTORE_TERMINATED"), "joinObserved": boolean("KEYSTORE_JOINED"),
                  "emulatorExitCode": number("KEYSTORE_EMULATOR_STATUS", True),
              }
              record["cleanupComplete"] = number("KEYSTORE_CLEANUP_STATUS") == 0 and (
                  record["terminationObserved"] and record["joinObserved"] and record["emulatorExitCode"] is not None)
              record["accepted"] = record["runtimeExitCode"] == 0 and record["cleanupComplete"]
              destination = Path("build/reports/keystore/host-cleanup.json")
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(json.dumps(record, sort_keys=True) + "\n", encoding="utf-8")
          except (OSError, ValueError, KeyError):
              raise SystemExit("Keystore cleanup report unavailable")
          if not record["accepted"]:
              raise SystemExit("Keystore runtime or owned cleanup did not pass")
          PY
            then cleanup_status=1; fi
            printf 'Owned keystore emulator cleanup: stop=%s terminated=%s joined=%s exit=%s\n' "$stop_status" "$terminated" "$joined" "$wait_status"
            if (( status == 0 && cleanup_status != 0 )); then status=1; fi
            return "$status"
          }
          trap 'status=$?; if cleanup "$status"; then exit 0; else exit $?; fi' EXIT
          # END B7 OWNED EMULATOR CLEANUP
          deadline=$((SECONDS + 600))
          while true; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              tail -n 100 "$emulator_log"
              echo '::error::The emulator exited before Android completed booting.'
              exit 1
            fi
            if booted="$(timeout 5s adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null)"; then
              if [[ "${booted//$'\r'/}" == 1 ]]; then break; fi
            fi
            if (( SECONDS >= deadline )); then
              tail -n 100 "$emulator_log"
              echo '::error::Android did not finish booting within 600 seconds.'
              exit 1
            fi
            sleep 5
          done
          actual_api="$(adb -s emulator-5554 shell getprop ro.build.version.sdk | tr -d '\r')"
          if [[ "$actual_api" != "$API_LEVEL" ]]; then
            echo "::error::Expected API $API_LEVEL but the booted emulator reports $actual_api."
            exit 1
          fi
          export ANDROID_SERIAL=emulator-5554
          ./gradlew --no-daemon --console=plain :core-security:connectedDebugAndroidTest
          python3 scripts/verify-keystore-results.py \
            --results core-security/build/outputs/androidTest-results/connected --api "$API_LEVEL"
      # Retain test results and public cleanup facts only: no APKs, logs, keystores, AVDs, or userdata.
      - name: Retain instrumentation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keystore-api-${{ matrix.api }}-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            core-security/build/outputs/androidTest-results/connected/**/*.xml
            core-security/build/reports/androidTests/connected/
            build/reports/keystore/host-cleanup.json
